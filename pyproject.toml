[project]
name = "polymer-builder"
version = "0.1.0"
description = "A local Dash app for building and optimizing linear homopolymer chains."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.17",
    "rdkit>=2023.9",
    "openbabel-wheel>=3.1.1.7",
    "numpy",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false
